name: CineFlux Multi-Platform Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Android + Web + Linux on Ubuntu ──────────────────────────────────
  build-android-web-linux:
    name: Android · Web · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding (runners are created in CI)
        run: flutter create . --platforms=android,web,linux --org com.cineflux --project-name cineflux

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Web (release)
        run: flutter build web --release --base-href /cineflux/

      - name: Build Linux desktop
        run: flutter build linux --release

      - name: Package Linux artifact
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../cineflux-linux-x64.tar.gz .

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Bundle
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-web
          path: build/web

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-linux-x64
          path: build/cineflux-linux-x64.tar.gz

  # ── Windows desktop ──────────────────────────────────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding (runners are created in CI)
        run: flutter create . --platforms=windows --org com.cineflux --project-name cineflux

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath cineflux-windows-x64.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-windows-x64
          path: cineflux-windows-x64.zip

  # ── iOS + macOS ──────────────────────────────────────────────────────
  build-apple:
    name: iOS · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding (runners are created in CI)
        run: flutter create . --platforms=ios,macos --org com.cineflux --project-name cineflux

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS runner
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -qry ../cineflux-ios-unsigned.zip Payload
          rm -rf Payload

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -qry ../../../cineflux-macos.zip *.app

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-ios-unsigned
          path: build/ios/iphoneos/cineflux-ios-unsigned.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: cineflux-macos
          path: build/macos/Build/Products/cineflux-macos.zip

  # ── Publish web build to GitHub Pages ────────────────────────────────
  deploy-web:
    name: Deploy Web to Pages
    runs-on: ubuntu-latest
    needs: build-android-web-linux
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch web bundle
        uses: actions/download-artifact@v4
        with:
          name: cineflux-web
          path: web

      - uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
